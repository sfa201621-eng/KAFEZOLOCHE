<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин-Кафе | Каса</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.clock {
    font-size: 18px;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h2 {
    margin-top: 0;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

input:focus,
select:focus {
    outline: 2px solid #2563eb;
}

button {
    border: none;
    cursor: pointer;
    font-weight: 700;
    background: #2563eb;
    color: white;
}

button:hover {
    opacity: .9;
}

.green {
    background: #16a34a;
}

.red {
    background: #dc2626;
}

.dark {
    background: #111827;
}

.orange {
    background: #ea580c;
}

.gray {
    background: #64748b;
}

.scan-area {
    display: flex;
    gap: 10px;
}

.scan-area input {
    flex: 1;
}

.scan-area button {
    width: 150px;
}

.scan-status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #ecfdf5;
    color: #166534;
    font-weight: bold;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
}

.product {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 15px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 7px;
}

.product-price {
    color: #16a34a;
    font-size: 20px;
    font-weight: bold;
}

.product-code {
    font-size: 12px;
    color: #64748b;
    margin-top: 6px;
}

.product button {
    margin-top: 10px;
}

.cart-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
}

.cart-name {
    font-weight: bold;
}

.cart-price {
    font-weight: bold;
}

.cart-controls {
    display: flex;
    gap: 5px;
    margin-top: 7px;
}

.cart-controls button {
    width: auto;
    padding: 7px 12px;
    margin: 0;
}

.total {
    font-size: 28px;
    font-weight: 800;
    text-align: right;
    margin-top: 18px;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.stat {
    padding: 18px;
    border-radius: 14px;
    background: #f8fafc;
    text-align: center;
}

.stat-number {
    font-size: 25px;
    font-weight: 800;
}

#barcodePreview {
    text-align: center;
    padding: 20px;
}

#barcode {
    max-width: 100%;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: white;
    border-radius: 18px;
    padding: 25px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
}

@media(max-width: 900px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

@media print {

    body * {
        visibility: hidden;
    }

    #printArea,
    #printArea * {
        visibility: visible;
    }

    #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    header {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛒 МАГАЗИН-КАФЕ</div>
    <div class="clock" id="clock"></div>
</header>

<div class="container">

    <div class="grid">

        <!-- ЛІВА ЧАСТИНА -->
        <main>

            <!-- СКАНЕР -->
            <div class="card">

                <h2>🔫 Сканування товару</h2>

                <div class="scan-area">
                    <input
                        id="scanInput"
                        type="text"
                        placeholder="Наведи сканер на штрихкод..."
                        autocomplete="off"
                    >

                    <button onclick="scanProduct()">
                        🔍 Сканувати
                    </button>
                </div>

                <div class="scan-status">
                    🟢 Сканер готовий
                </div>

            </div>

            <!-- ТОВАРИ -->
            <div class="card">

                <h2>📦 Товари</h2>

                <input
                    id="searchInput"
                    placeholder="🔎 Пошук товару..."
                    oninput="renderProducts()"
                >

                <br><br>

                <div class="products" id="productsList"></div>

            </div>

            <!-- СТАТИСТИКА -->
            <div class="card">

                <h2>📊 Статистика</h2>

                <div class="stats">

                    <div class="stat">
                        <div>Товарів</div>
                        <div class="stat-number" id="productsCount">
                            0
                        </div>
                    </div>

                    <div class="stat">
                        <div>Продажів</div>
                        <div class="stat-number" id="salesCount">
                            0
                        </div>
                    </div>

                    <div class="stat">
                        <div>Виручка</div>
                        <div class="stat-number">
                            <span id="revenue">0</span> грн
                        </div>
                    </div>

                </div>

            </div>

        </main>


        <!-- ПРАВА ЧАСТИНА -->
        <aside>

            <!-- КОШИК -->
            <div class="card">

                <h2>🛍️ Кошик</h2>

                <div id="cartList"></div>

                <div class="total">
                    Разом:
                    <span id="total">0.00</span> грн
                </div>

                <button
                    class="green"
                    onclick="openPayment()"
                >
                    💳 ОПЛАТА
                </button>

                <button
                    class="red"
                    onclick="clearCart()"
                >
                    🗑️ Очистити кошик
                </button>

            </div>


            <!-- АДМІН -->
            <div class="card">

                <h2>⚙️ Керування</h2>

                <button
                    class="dark"
                    onclick="openAddProduct()"
                >
                    ➕ Додати товар
                </button>

                <button
                    class="orange"
                    onclick="openBarcode()"
                >
                    🏷️ Створити штрихкод
                </button>

                <button
                    class="gray"
                    onclick="resetData()"
                >
                    ⚠️ Очистити базу товарів
                </button>

            </div>

        </aside>

    </div>

</div>


<!-- МОДАЛЬНЕ ВІКНО ДОДАВАННЯ -->
<div class="modal" id="productModal">

    <div class="modal-box">

        <h2>➕ Новий товар</h2>

        <input
            id="productName"
            placeholder="Назва товару"
        >

        <input
            id="productPrice"
            type="number"
            step="0.01"
            placeholder="Ціна, грн"
        >

        <select id="productCategory">

            <option value="Магазин">
                🛒 Магазин
            </option>

            <option value="Кафе">
                ☕ Кафе
            </option>

            <option value="Напої">
                🥤 Напої
            </option>

            <option value="Солодощі">
                🍫 Солодощі
            </option>

        </select>

        <input
            id="productCode"
            placeholder="Штрихкод"
        >

        <button
            class="orange"
            onclick="generateProductCode()"
        >
            🎲 Згенерувати штрихкод
        </button>

        <div id="newBarcodePreview"
             style="text-align:center;margin-top:15px;">
        </div>

        <div class="modal-buttons">

            <button
                class="green"
                onclick="saveProduct()"
            >
                💾 Зберегти
            </button>

            <button
                class="gray"
                onclick="closeProductModal()"
            >
                Закрити
            </button>

        </div>

    </div>

</div>


<!-- МОДАЛЬНЕ ВІКНО ОПЛАТИ -->
<div class="modal" id="paymentModal">

    <div class="modal-box">

        <h2>💳 Оплата</h2>

        <h1 style="text-align:center;">
            <span id="paymentTotal">0</span> грн
        </h1>

        <button
            class="green"
            onclick="finishSale('Готівка')"
        >
            💵 Готівка
        </button>

        <button
            onclick="finishSale('Картка')"
        >
            💳 Картка
        </button>

        <button
            class="gray"
            onclick="closePayment()"
        >
            Скасувати
        </button>

    </div>

</div>


<!-- МОДАЛЬНЕ ВІКНО ШТРИХКОДУ -->
<div class="modal" id="barcodeModal">

    <div class="modal-box">

        <h2>🏷️ Штрихкод</h2>

        <input
            id="barcodeName"
            placeholder="Назва товару"
        >

        <input
            id="barcodeCode"
            placeholder="Код"
        >

        <button
            onclick="generateBarcodePreview()"
        >
            🎲 Створити
        </button>

        <div id="barcodePreview"></div>

        <button
            class="green"
            onclick="printBarcode()"
        >
            🖨️ Друкувати
        </button>

        <button
            class="gray"
            onclick="closeBarcode()"
        >
            Закрити
        </button>

    </div>

</div>


<!-- ОБЛАСТЬ ДРУКУ -->
<div id="printArea" style="display:none;"></div>


<script>

/* =========================
   БАЗА ДАНИХ
========================= */

let products =
    JSON.parse(localStorage.getItem("shopProducts")) || [

    {
        id: 1,
        name: "Кола",
        price: 35,
        category: "Напої",
        code: "200000000001"
    },

    {
        id: 2,
        name: "Чіпси",
        price: 45,
        category: "Солодощі",
        code: "200000000002"
    },

    {
        id: 3,
        name: "Кава",
        price: 40,
        category: "Кафе",
        code: "200000000003"
    },

    {
        id: 4,
        name: "Хот-дог",
        price: 65,
        category: "Кафе",
        code: "200000000004"
    }

];


let cart = [];

let sales =
    JSON.parse(localStorage.getItem("shopSales")) || [];


/* =========================
   ЗБЕРЕЖЕННЯ
========================= */

function saveData() {

    localStorage.setItem(
        "shopProducts",
        JSON.stringify(products)
    );

    localStorage.setItem(
        "shopSales",
        JSON.stringify(sales)
    );

}


/* =========================
   ГОДИННИК
========================= */

function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("uk-UA");

}

setInterval(updateClock, 1000);

updateClock();


/* =========================
   ТОВАРИ
========================= */

function renderProducts() {

    const list =
        document.getElementById("productsList");

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered =
        products.filter(product =>
            product.name
            .toLowerCase()
            .includes(search)
        );

    list.innerHTML = "";

    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">Товарів не знайдено</div>';

        return;

    }

    filtered.forEach(product => {

        list.innerHTML += `

        <div class="product">

            <div class="product-name">
                ${escapeHTML(product.name)}
            </div>

            <div>
                ${product.category}
            </div>

            <div class="product-price">
                ${Number(product.price).toFixed(2)} грн
            </div>

            <div class="product-code">
                ШК: ${product.code}
            </div>

            <button
                onclick="addToCart('${product.code}')"
            >
                ➕ Додати
            </button>

        </div>

        `;

    });

    updateStats();

}


/* =========================
   ДОДАТИ В КОШИК
========================= */

function addToCart(code) {

    const product =
        products.find(p => p.code === code);

    if (!product) {

        alert("❌ Товар не знайдено!");

        return;

    }

    const existing =
        cart.find(item => item.code === code);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    renderCart();

}


/* =========================
   СКАНЕР
========================= */

function scanProduct() {

    const input =
        document.getElementById("scanInput");

    const code =
        input.value.trim();

    if (!code) return;

    addToCart(code);

    input.value = "";

    input.focus();

}


/*
   YuNew часто працює як клавіатура.
   Після сканування він вводить код
   і натискає Enter.
*/

document
.getElementById("scanInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        scanProduct();

    }

});


/*
   Поле сканування отримує фокус
   після завантаження.
*/

window.addEventListener("load", function() {

    document
    .getElementById("scanInput")
    .focus();

});


/* =========================
   КОШИК
========================= */

function renderCart() {

    const list =
        document.getElementById("cartList");

    list.innerHTML = "";

    if (cart.length === 0) {

        list.innerHTML =
            '<div class="empty">Кошик порожній</div>';

        document.getElementById("total").textContent =
            "0.00";

        return;

    }

    let total = 0;

    cart.forEach((item, index) => {

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        list.innerHTML += `

        <div class="cart-item">

            <div>

                <div class="cart-name">
                    ${escapeHTML(item.name)}
                </div>

                <div>
                    ${item.price.toFixed(2)} грн ×
                    ${item.quantity}
                </div>

                <div class="cart-controls">

                    <button
                        class="gray"
                        onclick="changeQuantity(${index}, -1)"
                    >
                        −
                    </button>

                    <button
                        onclick="changeQuantity(${index}, 1)"
                    >
                        +
                    </button>

                    <button
                        class="red"
                        onclick="removeFromCart(${index})"
                    >
                        ✕
                    </button>

                </div>

            </div>

            <div class="cart-price">
                ${itemTotal.toFixed(2)} грн
            </div>

        </div>

        `;

    });

    document.getElementById("total").textContent =
        total.toFixed(2);

}


function changeQuantity(index, change) {

    cart[index].quantity += change;

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }

    renderCart();

}


function removeFromCart(index) {

    cart.splice(index, 1);

    renderCart();

}


function clearCart() {

    if (cart.length === 0) return;

    if (confirm("Очистити кошик?")) {

        cart = [];

        renderCart();

    }

}


/* =========================
   ДОДАВАННЯ ТОВАРУ
========================= */

function openAddProduct() {

    document
    .getElementById("productModal")
    .style.display = "flex";

}


function closeProductModal() {

    document
    .getElementById("productModal")
    .style.display = "none";

}


function generateProductCode() {

    const code =
        "2" +
        Math.floor(
            100000000000 +
            Math.random() * 899999999999
        );

    document
    .getElementById("productCode")
    .value = code;

    showNewBarcode(code);

}


function showNewBarcode(code) {

    document
    .getElementById("newBarcodePreview")
    .innerHTML =
        '<svg id="newBarcode"></svg>';

    JsBarcode(
        "#newBarcode",
        code,
        {
            format: "CODE128",
            displayValue: true,
            height: 70
        }
    );

}


function saveProduct() {

    const name =
        document
        .getElementById("productName")
        .value
        .trim();

    const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );

    const category =
        document
        .getElementById("productCategory")
        .value;

    const code =
        document
        .getElementById("productCode")
        .value
        .trim();


    if (!name) {

        alert("Введи назву товару!");

        return;

    }

    if (!price || price < 0) {

        alert("Введи правильну ціну!");

        return;

    }

    if (!code) {

        alert("Створи або введи штрихкод!");

        return;

    }


    if (products.some(p => p.code === code)) {

        alert("❌ Такий штрихкод вже існує!");

        return;

    }


    products.push({

        id: Date.now(),

        name: name,

        price: price,

        category: category,

        code: code

    });


    saveData();

    renderProducts();

    closeProductModal();


    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productCode").value = "";
    document.getElementById("newBarcodePreview").innerHTML = "";


    alert("✅ Товар успішно додано!");

}


/* =========================
   ОПЛАТА
========================= */

function openPayment() {

    if (cart.length === 0) {

        alert("Кошик порожній!");

        return;

    }

    document.getElementById("paymentTotal")
        .textContent =
        calculateTotal().toFixed(2);

    document
    .getElementById("paymentModal")
    .style.display = "flex";

}


function closePayment() {

    document
    .getElementById("paymentModal")
    .style.display = "none";

}


function calculateTotal() {

    return cart.reduce(
        (sum, item) =>
            sum + item.price * item.quantity,
        0
    );

}


function finishSale(method) {

    const total =
        calculateTotal();

    const sale = {

        id: Date.now(),

        date: new Date().toLocaleString("uk-UA"),

        total: total,

        method: method,

        items: cart.map(item => ({
            name: item.name,
            price: item.price,
            quantity: item.quantity
        }))

    };


    sales.push(sale);

    saveData();

    printReceipt(sale);

    cart = [];

    renderCart();

    updateStats();

    closePayment();

}


/* =========================
   ЧЕК
========================= */

function printReceipt(sale) {

    const area =
        document.getElementById("printArea");

    let html = `

        <div style="
            width:280px;
            font-family:monospace;
            padding:15px;
        ">

        <h2 style="text-align:center;">
            МАГАЗИН-КАФЕ
        </h2>

        <div style="text-align:center;">
            Дякуємо за покупку!
        </div>

        <hr>

    `;


    sale.items.forEach(item => {

        html += `

            <div>
                ${escapeHTML(item.name)}
            </div>

            <div>
                ${item.quantity} ×
                ${item.price.toFixed(2)}
                =
                ${(item.quantity * item.price).toFixed(2)}
                грн
            </div>

        `;

    });


    html += `

        <hr>

        <h3>
            РАЗОМ:
            ${sale.total.toFixed(2)} грн
        </h3>

        <div>
            Оплата: ${sale.method}
        </div>

        <div>
            ${sale.date}
        </div>

        <hr>

        <div style="text-align:center;">
            Гарного дня! 🙂
        </div>

        </div>

    `;


    area.innerHTML = html;

    area.style.display = "block";

    window.print();

    area.style.display = "none";

}


/* =========================
   ГЕНЕРАТОР ШТРИХКОДІВ
========================= */

function openBarcode() {

    document
    .getElementById("barcodeModal")
    .style.display = "flex";

}


function closeBarcode() {

    document
    .getElementById("barcodeModal")
    .style.display = "none";

}


function generateBarcodePreview() {

    let code =
        document
        .getElementById("barcodeCode")
        .value
        .trim();

    if (!code) {

        code =
            "2" +
            Math.floor(
                100000000000 +
                Math.random() * 899999999999
            );

        document
        .getElementById("barcodeCode")
        .value = code;

    }


    document
    .getElementById("barcodePreview")
    .innerHTML = `

        <div style="font-weight:bold;">
            ${escapeHTML(
                document
                .getElementById("barcodeName")
                .value
            )}
        </div>

        <svg id="barcodeSVG"></svg>

    `;


    JsBarcode(
        "#barcodeSVG",
        code,
        {
            format: "CODE128",
            displayValue: true,
            height: 80,
            width: 2
        }
    );

}


function printBarcode() {

    const name =
        document
        .getElementById("barcodeName")
        .value;

    const code =
        document
        .getElementById("barcodeCode")
        .value;

    if (!code) {

        alert("Спочатку створи штрихкод!");

        return;

    }


    const area =
        document.getElementById("printArea");


    area.innerHTML = `

        <div style="
            width:300px;
            text-align:center;
            font-family:Arial;
            padding:20px;
        ">

            <strong>
                ${escapeHTML(name)}
            </strong>

            <br><br>

            <svg id="printBarcode"></svg>

        </div>

    `;


    JsBarcode(
        "#printBarcode",
        code,
        {
            format: "CODE128",
            displayValue: true,
            height: 80,
            width: 2
        }
    );


    area.style.display = "block";

    window.print();

    area.style.display = "none";

}


/* =========================
   СТАТИСТИКА
========================= */

function updateStats() {

    document.getElementById("productsCount")
        .textContent = products.length;

    document.getElementById("salesCount")
        .textContent = sales.length;

    const revenue =
        sales.reduce(
            (sum, sale) =>
                sum + sale.total,
            0
        );

    document.getElementById("revenue")
        .textContent =
        revenue.toFixed(2);

}


/* =========================
   ОЧИЩЕННЯ БАЗИ
========================= */

function resetData() {

    if (!confirm(
        "УВАГА!\n\nВидалити всі товари та продажі?"
    )) {

        return;

    }

    products = [];

    sales = [];

    cart = [];

    saveData();

    renderProducts();

    renderCart();

    updateStats();

}


/* =========================
   БЕЗПЕКА ТЕКСТУ
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ЗАПУСК
========================= */

renderProducts();

renderCart();

updateStats();

</script>
